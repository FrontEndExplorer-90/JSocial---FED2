<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSocial – Edit Post</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="/src/css/style.css">

</head>

<body>

  <div class="timeline-container">

    <header class="timeline-hero text-center mb-5">
      <img src="https://i.postimg.cc/7YqrZNG6/Logo-JSocial.png" alt="App Logo" style="height:80px; max-width:100%;"
        class="mb-3" />

      <h1 class="fw-bold text-light">JSocial</h1>

      <p class="text-light">
        Edit your post below
      </p>
    </header>

    <div class="edit-container">

      <div class="edit-card">

        <h2 class="form-title">
          Edit Your Post
        </h2>

        <p class="form-subtitle">
          Update your thoughts and share them with the community.
        </p>

        <form name="editPost" id="edit-post">

          <div class="mb-4">
            <label for="title" class="form-label">
              Title
            </label>

            <input id="title" name="title" required class="form-control" />
          </div>

          <div class="mb-4">
            <label for="body" class="form-label">
              Body
            </label>

            <textarea id="body" name="body" rows="6" class="form-control"></textarea>
          </div>

          <div class="d-flex gap-3">

            <button type="submit" class="btn save-btn">
              Save Changes
            </button>

            <a href="/post/index.html" class="btn cancel-btn">
              Cancel
            </a>

          </div>

        </form>

      </div>

    </div>

  </div>

  <script type="module" src="../../src/app.js"></script>

</body>

</html>
