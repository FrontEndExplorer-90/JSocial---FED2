<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>JSocial – Create Post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

  <div class="timeline-container">

    <header class="timeline-hero text-center mb-5">
      <img src="https://i.postimg.cc/7YqrZNG6/Logo-JSocial.png" alt="App Logo" style="height:80px; max-width:100%;"
        class="mb-3" />

      <h1 class="fw-bold text-light">JSocial</h1>
      <p class="text-light">Create a new post</p>
    </header>

    <nav class="mb-4">
      <a href="/post/index.html" class="btn btn-outline-light">
        ← Back to Timeline
      </a>
    </nav>

    <div class="create-post-card">

      <h2 class="text-light mb-4">
        Create Post
      </h2>

      <form name="createPost" id="create-post">

        <div class="mb-3">
          <label for="title" class="form-label text-light">
            Title
          </label>

          <input id="title" name="title" class="form-control" required />
        </div>

        <div class="mb-4">
          <label for="body" class="form-label text-light">
            Body
          </label>

          <textarea id="body" name="body" rows="6" class="form-control"></textarea>
        </div>

        <div class="d-flex justify-content-between">

          <a href="/post/index.html" class="btn btn-outline-light">
            Cancel
          </a>

          <button type="submit" class="btn btn-success">
            Publish Post
          </button>

        </div>

      </form>

    </div>

  </div>

  <script type="module" src="../../src/app.js"></script>

</body>

</html>
