<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>JSocial – Timeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>
  <div class="timeline-container">

    <header class="timeline-hero text-center mb-5">
      <img src="https://i.postimg.cc/7YqrZNG6/Logo-JSocial.png" alt="App Logo" style="height:80px; max-width:100%;"
        class="mb-3" />

      <h1 class="fw-bold text-light">JSocial Timeline</h1>
      <p class="text-light">Share your thoughts with the community</p>
    </header>

    <h2 class="mb-4 text-light">Timeline</h2>

    <nav class="mb-4 d-flex gap-2">
      <a href="/profile/index.html" class="btn btn-outline-light">
        My profile
      </a>

      <a href="/post/create/index.html" class="btn btn-success">
        + New Post
      </a>

      <button id="logout" class="btn btn-danger ms-auto">
        Logout
      </button>
    </nav>

    <div class="mb-4">
      <input id="search" type="search" class="form-control" placeholder="Search posts..." aria-label="Search posts" />
    </div>

    <ul id="feed" class="list-unstyled"></ul>

  </div>

  <script type="module" src="../src/app.js"></script>
</body>

</html>
