<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JSocial – Welcome</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

  <div class="timeline-container">

    <header class="timeline-hero text-center mb-5">
      <img src="https://i.postimg.cc/7YqrZNG6/Logo-JSocial.png" alt="App Logo" style="height:80px; max-width:100%;"
        class="mb-3" />

      <h1 class="fw-bold text-light">JSocial</h1>

      <p class="text-light">
        Connect. Share. Discover.
      </p>
    </header>

    <div class="auth-card text-center">

      <h2 class="text-light mb-3">
        Welcome
      </h2>

      <p class="text-light opacity-75 mb-4">
        Login or create an account to join the community.
      </p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">

        <a href="./login/" class="btn btn-outline-light px-4">
          Login
        </a>

        <a href="./register/" class="btn btn-success px-4">
          Register
        </a>

      </div>

    </div>

  </div>

  <script type="module" src="../src/app.js"></script>

</body>

</html>
