<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JSocial – Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

  <div class="timeline-container">

    <header class="timeline-hero text-center mb-5">
      <img src="https://i.postimg.cc/7YqrZNG6/Logo-JSocial.png" alt="App Logo" style="height:80px; max-width:100%;"
        class="mb-3" />

      <h1 class="fw-bold text-light">JSocial</h1>
      <p class="text-light">Connect. Share. Explore.</p>
    </header>

    <div class="auth-card">

      <h2 class="text-light text-center mb-4">
        Login
      </h2>

      <form name="login">

        <div class="mb-3">
          <label for="email" class="form-label text-light">
            Email
          </label>

          <input id="email" type="email" name="email" class="form-control" required />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label text-light">
            Password
          </label>

          <input id="password" type="password" name="password" class="form-control" required />
        </div>

        <div class="d-flex justify-content-between align-items-center">

          <a href="/auth/register/" class="btn btn-outline-light">
            Register
          </a>

          <button type="submit" class="btn btn-success">
            Login
          </button>

        </div>

      </form>

    </div>

  </div>

  <script type="module" src="../../src/app.js"></script>

</body>

</html>
